name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # 和 package.json 的 packageManager、dependabot 用同一个 npm：不同大版本对锁文件里可选依赖的处理不一样（#83）
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - name: 类型检查
        run: npm run check
      - name: 代码检查
        run: npm run lint
      - name: 格式检查
        run: npm run format:check
      - name: 测试
        run: npm test
      - name: 构建
        run: npm run build
      # 文档站只在合并后才构建发布；在 PR 里先构建一次，坏链接和语法错误不用等到合并才发现
      - name: 构建文档站
        run: npm run docs:build
