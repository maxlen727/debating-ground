name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run check
      - name: 测试
        run: npm test
      - name: 构建
        run: npm run build
      # 文档站只在合并后才构建发布；在 PR 里先构建一次，坏链接和语法错误不用等到合并才发现
      - name: 构建文档站
        run: npm run docs:build
