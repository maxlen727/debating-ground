name: 原生安卓版

# 原生版（native/，Kotlin + Compose）将替换套壳版（#104）。切换之前只构建和测试，不发布，不影响现有 App（android.yml）的发布。
# PR 和 main 上都会构建 debug 包（包名带 .dev，能和正式版同时装）、跑单元测试和截图测试，结果作为构建产物上传。
# 手动运行时另外构建一个“升级测试包”：正式签名、同一个包名，装在套壳版上面就是一次升级，用来在真机上验证知识库迁移。
# 原生版的测试会读网页版的样式和图标，确认两边没有走样，所以那两个文件变了也要跑。
on:
  pull_request:
    paths: ['native/**', 'src/styles.css', 'src/components/ui.tsx', '.github/workflows/native.yml']
  push:
    branches: [main]
    paths: ['native/**', 'src/styles.css', 'src/components/ui.tsx', '.github/workflows/native.yml']
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      # ktlint 管 Kotlin 写法，Android Lint 管安卓相关的问题（严格模式：警告也算失败）
      - name: 代码检查
        run: ./gradlew ktlintCheck lintDebug --console=plain

      - name: 构建 debug 包、跑单元测试和截图测试
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain

      - name: 上传 debug 包
        uses: actions/upload-artifact@v7
        with:
          name: sibian-native-debug
          path: native/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # 截图测试失败时也上传，方便看出了什么问题
      - name: 上传截图和测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sibian-native-screenshots
          path: |
            native/app/build/screenshots/
            native/app/build/reports/
          retention-days: 14

  # 升级测试包：只在手动运行时构建，只作为构建产物（不进 Releases，不推给用户）。
  # 用和套壳版同一把签名、同一个包名，versionCode 排在套壳版最新一次构建之后，手机才会当成更新
  upgrade-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: 版本号
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --workflow android.yml --branch main --limit 1 --json number -q '.[0].number')
          echo "code=$((1000 + last + 1))" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./package.json').version")-native-test.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: 构建正式签名的升级测试包
        working-directory: native
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::没有配置签名密钥，升级测试包必须和套壳版同一把签名。见 docs/dev/android.md。"; exit 1; fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          ./gradlew assembleRelease -PversionCode=${{ steps.ver.outputs.code }} -PversionName=${{ steps.ver.outputs.name }} --console=plain
          rm -f "$ANDROID_KEYSTORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk "../sibian-${{ steps.ver.outputs.name }}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: sibian-${{ steps.ver.outputs.name }}
          path: sibian-${{ steps.ver.outputs.name }}.apk
          retention-days: 14
